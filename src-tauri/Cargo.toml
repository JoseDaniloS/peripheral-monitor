[package]
name = "peripheral-monitor"
version = "0.1.0"
license = "GPL-3.0-only"
repository = "https://github.com/JoseDaniloS/peripheral-monitor"
description = "Monitor de dispositivos USB/HID para Windows"
authors = ["Peripheral Monitor"]
edition = "2021"

[lib]
name = "peripheral_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties"] }
